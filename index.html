<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d16" />
  <title>DOĞU STORE — Mağaza Yönetim Sistemi</title>
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #090d16;
      --card: #111827;
      --card-2: #0b1120;
      --border: #1f2937;
      --border-2: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #2563eb;
      --green: #059669;
      --amber: #d97706;
      --red: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .app-shell {
      width: 100%;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: calc(82px + var(--safe-bottom));
    }
    .header-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(9, 13, 22, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .logo-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pill-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: #0d1322;
      scrollbar-width: none;
    }
    .pill-strip::-webkit-scrollbar { display: none; }
    .pill-btn {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      background: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
    }
    .pill-btn.active {
      background: var(--blue);
      color: #fff;
    }
    .main-wrap {
      padding: 16px;
      max-width: 1040px;
      margin: 0 auto;
    }
    .stack > * + * { margin-top: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 12px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }
    @media (min-width: 768px) {
      .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .pos-layout { grid-template-columns: 7fr 5fr; }
    }
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .row-gap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .title-lg {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }
    .title-md {
      margin: 0 0 8px 0;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .muted { color: var(--muted); font-size: 12px; }
    .val-lg { font-size: 18px; font-weight: 800; margin-top: 4px; }
    .text-green { color: #34d399; }
    .text-blue { color: #60a5fa; }
    .text-amber { color: #fbbf24; }
    .text-red { color: #f87171; }
    .text-white { color: #ffffff; }
    .input {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border-2);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 15px;
      outline: none;
    }
    .input:focus { border-color: #3b82f6; }
    label.lbl {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-sm { padding: 7px 11px; font-size: 12px; border-radius: 10px; }
    .btn-block { width: 100%; }
    .btn-primary { background: var(--blue); }
    .btn-success { background: var(--green); }
    .btn-warning { background: var(--amber); color: #111827; }
    .btn-danger { background: var(--red); }
    .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid var(--border-2); }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      padding-bottom: var(--safe-bottom);
      background: rgba(15, 23, 42, 0.97);
      border-top: 1px solid var(--border-2);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
    .nav-item {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
    }
    .nav-item.active { color: #60a5fa; font-weight: 800; }
    .badge {
      background: var(--red);
      color: #fff;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 800;
    }
    .list-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .list-item:last-child { border-bottom: 0; }
    .sub-box {
      background: #0d1322;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .hidden { display: none !important; }
    .toast-box {
      position: fixed;
      top: calc(14px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      background: #1e293b;
      color: #fff;
      border: 1px solid #64748b;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      max-width: 92vw;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }
    .login-wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
    }
    .scan-frame-wrap {
      position: relative;
      width: 100%;
      min-height: 210px;
      max-height: 260px;
      border-radius: 12px;
      background: #000;
      overflow: hidden;
      border: 1px solid var(--border-2);
    }
    .scan-line {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 2px;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      pointer-events: none;
    }
    .chip {
      border: 1px solid var(--border-2);
      background: #0d1322;
      color: #e2e8f0;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }
    table.rep-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.rep-table th, table.rep-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    table.rep-table th {
      color: var(--muted);
      font-size: 12px;
      background: #0d1322;
    }
    @media print {
      .header-bar, .pill-strip, .bottom-nav, .no-print, #toast, .modal-backdrop { display: none !important; }
      body, .app-shell { background: #fff !important; color: #000 !important; padding: 0 !important; }
      .card, .sub-box { background: #fff !important; color: #000 !important; border: 1px solid #cbd5e1 !important; }
      .muted { color: #475569 !important; }
      .text-green, .text-blue, .text-amber, .text-red, .text-white { color: #000 !important; }
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="toast" class="toast-box hidden"></div>

  <!-- Gelişmiş Barkod Okuma Modalı -->
  <div id="barcodeModal" class="modal-backdrop hidden">
    <div class="card stack" style="width:100%;max-width:440px;">
      <div class="row-between">
        <div class="title-md" style="margin:0;">Barkod & Karekod Okut</div>
        <button onclick="closeBarcodeModal()" class="btn btn-danger btn-sm">Kapat</button>
      </div>
      <div class="muted" id="barcodeModalHint">EAN-13 çizgili barkod veya 2D karekod okutun, fotoğraf çekin ya da numarasını girin.</div>
      <div id="barcodeStatus" class="muted text-amber" style="font-weight:700;">Durum: Hazır</div>

      <div class="scan-frame-wrap">
        <video id="barcodeVideo" playsinline autoplay muted style="width:100%;height:220px;object-fit:cover;display:block;"></video>
        <div class="scan-line"></div>
      </div>

      <div class="grid-2">
        <button id="startCamBtn" type="button" onclick="startCameraScan()" class="btn btn-warning btn-sm">Canlı Kamera</button>
        <label class="btn btn-success btn-sm" style="cursor:pointer;">
          Fotoğraf Çek / Seç
          <input id="photoBarcodeInput" type="file" accept="image/*" capture="environment" onchange="handleBarcodePhoto(event)" class="hidden" />
        </label>
      </div>

      <div class="row-gap">
        <button type="button" onclick="captureFrameAndDecode()" class="btn btn-secondary btn-sm" style="flex:1;">Anlık Kareyi Tara</button>
        <button type="button" onclick="stopCameraScan()" class="btn btn-secondary btn-sm">Kamerayı Kapat</button>
      </div>

      <div class="row-gap">
        <input id="manualBarcodeInput" type="text" inputmode="text" placeholder="Barkod / etiket kodu yazın..." class="input" style="flex:1;" onkeydown="if(event.key==='Enter') submitManualBarcode()" />
        <button type="button" onclick="submitManualBarcode()" class="btn btn-primary btn-sm">Kullan</button>
      </div>

      <div id="recentScansBox" class="hidden">
        <div class="muted" style="margin-bottom:6px;">Son Okutulan Kodlar:</div>
        <div id="recentScansList" class="row-gap"></div>
      </div>
    </div>
  </div>

  <!-- Hızlı Barkod Sorgu Kartı -->
  <div id="quickLookupModal" class="modal-backdrop hidden">
    <div id="quickLookupContent" class="card stack" style="width:100%;max-width:420px;"></div>
  </div>

  <!-- Gün Sonu Z Raporu Modalı -->
  <div id="zReportModal" class="modal-backdrop hidden">
    <div id="zReportContent" class="card stack" style="width:100%;max-width:480px;"></div>
  </div>

  <!-- Yönetici PIN Modalı -->
  <div id="pinModal" class="modal-backdrop hidden">
    <div class="card stack" style="width:100%;max-width:360px;">
      <div class="row-between">
        <div id="pinModalTitle" class="title-md" style="margin:0;">Yönetici Onayı</div>
        <button onclick="resolvePinModal(false)" class="btn btn-secondary btn-sm">&times;</button>
      </div>
      <div id="pinModalDesc" class="muted">İşlemi onaylamak için yönetici PIN kodunu girin.</div>
      <input id="pinModalInput" type="password" inputmode="numeric" placeholder="PIN kodu" class="input" style="text-align:center;font-size:20px;letter-spacing:4px;" onkeydown="if(event.key==='Enter') checkPinModal()" />
      <div class="row-gap">
        <button onclick="resolvePinModal(false)" class="btn btn-secondary" style="flex:1;">İptal</button>
        <button onclick="checkPinModal()" class="btn btn-primary" style="flex:1;">Onayla</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'DOGU_STORE_V4_DATA';

    function uid(p='id') {
      return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
    }
    function nowISO() { return new Date().toISOString(); }
    function formatTL(v) {
      return Number(v || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₺';
    }
    function formatDT(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    }
    function toLocalDateKey(isoOrDate) {
      const d = isoOrDate instanceof Date ? isoOrDate : new Date(isoOrDate);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function defaultState() {
      return {
        settings: {
          storeName: 'DOĞU STORE',
          storeLogoText: 'DS',
          currency: 'TL',
          defaultCriticalStock: 5,
          maxStaffDiscount: 20,
          autoDeductStock: true
        },
        users: [
          { id: 'usr_admin', name: 'Yönetici', role: 'admin', pin: '1234', active: true },
          { id: 'usr_staff', name: 'Personel 1', role: 'staff', pin: '0000', active: true }
        ],
        products: [],
        sales: [],
        customers: [],
        transactions: [],
        expenses: [],
        stockMovements: [],
        auditLogs: [],
        recentScans: []
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('DOGU_STORE_V3_DATA') || localStorage.getItem('DOGU_STORE_V2_DATA');
        if (!raw) return defaultState();
        const p = JSON.parse(raw);
        const d = defaultState();
        return {
          ...d,
          ...p,
          settings: { ...d.settings, ...(p.settings || {}) },
          users: Array.isArray(p.users) && p.users.length ? p.users : d.users,
          products: Array.isArray(p.products) ? p.products : [],
          sales: Array.isArray(p.sales) ? p.sales : [],
          customers: Array.isArray(p.customers) ? p.customers : [],
          transactions: Array.isArray(p.transactions) ? p.transactions : [],
          expenses: Array.isArray(p.expenses) ? p.expenses : [],
          stockMovements: Array.isArray(p.stockMovements) ? p.stockMovements : [],
          auditLogs: Array.isArray(p.auditLogs) ? p.auditLogs : [],
          recentScans: Array.isArray(p.recentScans) ? p.recentScans : []
        };
      } catch (e) {
        return defaultState();
      }
    }

    let state = loadState();
    let currentUser = null;
    let activeTab = 'dashboard';
    let cart = [];
    let selectedCustId = '';
    let discType = 'percent';
    let discVal = 0;
    let pinWaiter = null;
    let barcodeCallback = null;
    let camStream = null;
    let camTimer = null;
    let zxingReader = null;
    let scanBusy = false;

    const nowInit = new Date();
    let zReportDate = toLocalDateKey(nowInit);
    let reportYear = nowInit.getFullYear();
    let reportMonth = nowInit.getMonth() + 1;

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function toast(msg, kind='info') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.borderColor = kind === 'error' ? '#f87171' : kind === 'success' ? '#34d399' : '#64748b';
      el.style.background = kind === 'error' ? '#450a0a' : kind === 'success' ? '#064e3b' : '#1e293b';
      el.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add('hidden'), 2800);
    }

    function setScanStatus(msg, colorClass='text-amber') {
      const el = document.getElementById('barcodeStatus');
      if (!el) return;
      el.className = 'muted ' + colorClass;
      el.style.fontWeight = '700';
      el.textContent = 'Durum: ' + msg;
    }

    function recordRecentScan(code) {
      const clean = String(code || '').trim();
      if (!clean) return;
      state.recentScans = [clean, ...(state.recentScans || []).filter(x => x !== clean)].slice(0, 8);
      saveState();
    }

    function renderRecentScans() {
      const wrap = document.getElementById('recentScansBox');
      const list = document.getElementById('recentScansList');
      if (!wrap || !list) return;
      if (!state.recentScans || !state.recentScans.length) {
        wrap.classList.add('hidden');
        return;
      }
      wrap.classList.remove('hidden');
      list.innerHTML = state.recentScans.map(code =>
        `<button type="button" onclick="completeBarcodeScan('${esc(code)}')" class="chip">${esc(code)}</button>`
      ).join('');
    }

    function logAction(action, detail) {
      state.auditLogs.unshift({
        id: uid('log'),
        userId: currentUser ? currentUser.id : 'sys',
        userName: currentUser ? currentUser.name : 'Sistem',
        role: currentUser ? currentUser.role : 'sys',
        action,
        detail,
        createdAt: nowISO()
      });
      saveState();
    }

    function isAdmin() { return currentUser && currentUser.role === 'admin'; }

    function requestPin(title, desc) {
      if (isAdmin()) return Promise.resolve(true);
      return new Promise(res => {
        pinWaiter = res;
        document.getElementById('pinModalTitle').textContent = title || 'Yönetici Onayı';
        document.getElementById('pinModalDesc').textContent = desc || 'Yönetici PIN kodunu girin.';
        const inp = document.getElementById('pinModalInput');
        inp.value = '';
        document.getElementById('pinModal').classList.remove('hidden');
        setTimeout(() => inp.focus(), 60);
      });
    }

    function resolvePinModal(ok) {
      document.getElementById('pinModal').classList.add('hidden');
      const fn = pinWaiter;
      pinWaiter = null;
      if (fn) fn(ok);
    }

    function checkPinModal() {
      const entered = (document.getElementById('pinModalInput').value || '').trim();
      const ok = state.users.some(u => u.role === 'admin' && u.active && u.pin === entered);
      if (!ok) {
        toast('Hatalı yönetici PIN kodu!', 'error');
        return;
      }
      resolvePinModal(true);
    }

    const EAN_L = {
      '0001101':'0','0011001':'1','0010011':'2','0111101':'3','0100011':'4',
      '0110001':'5','0101111':'6','0111011':'7','0110111':'8','0001011':'9'
    };
    const EAN_G = {
      '0100111':'0','0110011':'1','0011011':'2','0100001':'3','0011101':'4',
      '0111001':'5','0000101':'6','0010001':'7','0001001':'8','0010111':'9'
    };
    const EAN_R = {
      '1110010':'0','1100110':'1','1101100':'2','1000010':'3','1011100':'4',
      '1001110':'5','1010000':'6','1000100':'7','1001000':'8','1110100':'9'
    };
    const EAN13_PARITY = {
      'LLLLLL':'0','LLGLGG':'1','LLGGLG':'2','LLGGGL':'3','LGLLGG':'4',
      'LGGLLG':'5','LGGGLL':'6','LGLGLG':'7','LGLGGL':'8','LGGLGL':'9'
    };

    function isValidEAN13(code) {
      if (!/^\d{13}$/.test(code)) return false;
      let sum = 0;
      for (let i = 0; i < 12; i++) sum += Number(code[i]) * (i % 2 === 0 ? 1 : 3);
      return ((10 - (sum % 10)) % 10) === Number(code[12]);
    }

    function isValidEAN8(code) {
      if (!/^\d{8}$/.test(code)) return false;
      let sum = 0;
      for (let i = 0; i < 7; i++) sum += Number(code[i]) * (i % 2 === 0 ? 3 : 1);
      return ((10 - (sum % 10)) % 10) === Number(code[7]);
    }

    function decodeEANFromRow(row) {
      const n = row.length;
      if (n < 95) return null;
      const runs = [];
      let cur = row[0], cnt = 1;
      for (let i = 1; i < n; i++) {
        if (row[i] === cur) cnt++;
        else { runs.push({ v: cur, len: cnt }); cur = row[i]; cnt = 1; }
      }
      runs.push({ v: cur, len: cnt });

      for (let startIdx = 0; startIdx < runs.length - 20; startIdx++) {
        for (let modSpan = 1; modSpan <= 3; modSpan++) {
          let sumLen = 0;
          for (let m = 0; m < modSpan; m++) sumLen += (runs[startIdx + m]?.len || 0);
          const avgMod = sumLen / modSpan;
          if (avgMod < 1.0) continue;

          let startPx = 0;
          for (let k = 0; k < startIdx; k++) startPx += runs[k].len;

          const span13 = avgMod * 95;
          if (startPx + span13 <= n) {
            const bits = [];
            for (let m = 0; m < 95; m++) {
              const px = Math.min(n - 1, Math.floor(startPx + (m + 0.5) * avgMod));
              bits.push(row[px]);
            }
            if (bits[0]===1 && bits[1]===0 && bits[2]===1 &&
                bits[45]===0 && bits[46]===1 && bits[47]===0 && bits[48]===1 && bits[49]===0 &&
                bits[92]===1 && bits[93]===0 && bits[94]===1) {
              let parity = '', leftDigits = '', ok = true;
              for (let d = 0; d < 6; d++) {
                const pat = bits.slice(3 + d * 7, 3 + (d + 1) * 7).join('');
                if (EAN_L[pat]) { parity += 'L'; leftDigits += EAN_L[pat]; }
                else if (EAN_G[pat]) { parity += 'G'; leftDigits += EAN_G[pat]; }
                else { ok = false; break; }
              }
              if (ok && EAN13_PARITY[parity]) {
                let rightDigits = '';
                for (let d = 0; d < 6; d++) {
                  const pat = bits.slice(50 + d * 7, 50 + (d + 1) * 7).join('');
                  if (EAN_R[pat]) rightDigits += EAN_R[pat];
                  else { ok = false; break; }
                }
                if (ok) {
                  const full13 = EAN13_PARITY[parity] + leftDigits + rightDigits;
                  if (isValidEAN13(full13)) return full13;
                }
              }
            }
          }

          const span8 = avgMod * 67;
          if (startPx + span8 <= n) {
            const bits8 = [];
            for (let m = 0; m < 67; m++) {
              const px = Math.min(n - 1, Math.floor(startPx + (m + 0.5) * avgMod));
              bits8.push(row[px]);
            }
            if (bits8[0]===1 && bits8[1]===0 && bits8[2]===1 &&
                bits8[31]===0 && bits8[32]===1 && bits8[33]===0 && bits8[34]===1 && bits8[35]===0 &&
                bits8[64]===1 && bits8[65]===0 && bits8[66]===1) {
              let d8 = '', ok8 = true;
              for (let d = 0; d < 4; d++) {
                const pat = bits8.slice(3 + d * 7, 3 + (d + 1) * 7).join('');
                if (EAN_L[pat]) d8 += EAN_L[pat]; else { ok8 = false; break; }
              }
              if (ok8) {
                for (let d = 0; d < 4; d++) {
                  const pat = bits8.slice(36 + d * 7, 36 + (d + 1) * 7).join('');
                  if (EAN_R[pat]) d8 += EAN_R[pat]; else { ok8 = false; break; }
                }
              }
              if (ok8 && isValidEAN8(d8)) return d8;
            }
          }
        }
      }
      return null;
    }

    function decodeBarcodeFromCanvas(canvas) {
      try {
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const w = canvas.width, h = canvas.height;
        if (!w || !h) return null;
        const img = ctx.getImageData(0, 0, w, h).data;
        const rowsToTest = [0.5, 0.45, 0.55, 0.4, 0.6, 0.35, 0.65, 0.3, 0.7];

        for (const ratio of rowsToTest) {
          const y = Math.min(h - 1, Math.max(0, Math.floor(h * ratio)));
          const lum = new Float32Array(w);
          let minV = 255, maxV = 0, sum = 0;
          for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            const v = 0.299 * img[idx] + 0.587 * img[idx + 1] + 0.114 * img[idx + 2];
            lum[x] = v;
            sum += v;
            if (v < minV) minV = v;
            if (v > maxV) maxV = v;
          }
          for (const th of [sum / w, (minV + maxV) / 2]) {
            const row = new Uint8Array(w);
            for (let x = 0; x < w; x++) row[x] = lum[x] < th ? 1 : 0;
            const code = decodeEANFromRow(row);
            if (code) return code;
          }
        }
      } catch (e) {}
      return null;
    }

    async function decodeWithZXing(canvasOrImg) {
      try {
        if (!window.ZXing || !window.ZXing.BrowserMultiFormatReader) return null;
        if (!zxingReader) {
          const hints = new Map();
          const formats = [
            window.ZXing.BarcodeFormat.DATA_MATRIX,
            window.ZXing.BarcodeFormat.QR_CODE,
            window.ZXing.BarcodeFormat.EAN_13,
            window.ZXing.BarcodeFormat.EAN_8,
            window.ZXing.BarcodeFormat.CODE_128,
            window.ZXing.BarcodeFormat.CODE_39,
            window.ZXing.BarcodeFormat.UPC_A,
            window.ZXing.BarcodeFormat.UPC_E,
            window.ZXing.BarcodeFormat.ITF
          ];
          hints.set(window.ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
          hints.set(window.ZXing.DecodeHintType.TRY_HARDER, true);
          zxingReader = new window.ZXing.BrowserMultiFormatReader(hints);
        }
        const dataUrl = canvasOrImg.tagName === 'CANVAS' ? canvasOrImg.toDataURL('image/png') : canvasOrImg.src;
        if (!dataUrl) return null;
        const res = await zxingReader.decodeFromImageUrl(dataUrl);
        if (res && res.getText()) return String(res.getText()).trim();
      } catch (e) {}
      return null;
    }

    async function decodeFromImageSource(source) {
      if ('BarcodeDetector' in window) {
        try {
          const supported = typeof window.BarcodeDetector.getSupportedFormats === 'function'
            ? await window.BarcodeDetector.getSupportedFormats()
            : ['ean_13', 'ean_8', 'code_128', 'code_39', 'qr_code', 'data_matrix', 'upc_a', 'upc_e', 'itf'];
          const wanted = ['ean_13', 'ean_8', 'code_128', 'code_39', 'qr_code', 'data_matrix', 'upc_a', 'upc_e', 'itf']
            .filter(f => supported.includes(f));
          const detector = new window.BarcodeDetector({ formats: wanted.length ? wanted : undefined });
          const codes = await detector.detect(source);
          if (codes && codes.length && codes[0].rawValue) return String(codes[0].rawValue).trim();
        } catch (e) {}
      }

      const sw = source.videoWidth || source.naturalWidth || source.width || 0;
      const sh = source.videoHeight || source.naturalHeight || source.height || 0;
      if (!sw || !sh) return null;

      const targetW = Math.min(1400, sw);
      const scale = targetW / sw;
      const c = document.createElement('canvas');
      c.width = targetW;
      c.height = Math.max(120, Math.floor(sh * scale));
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(source, 0, 0, c.width, c.height);

      const localEAN = decodeBarcodeFromCanvas(c);
      if (localEAN) return localEAN;
      const zxingRes = await decodeWithZXing(c);
      if (zxingRes) return zxingRes;
      return null;
    }

    async function startCameraScan() {
      stopCameraScan();
      const video = document.getElementById('barcodeVideo');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setScanStatus('Canlı kamera desteklenmiyor; "Fotoğraf Çek / Seç" veya manuel girişi kullanın.', 'text-amber');
        return;
      }
      try {
        setScanStatus('Kamera açılıyor...', 'text-amber');
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = camStream;
        await video.play().catch(() => {});
        setScanStatus('Barkod veya karekodu çerçeveye hizalayın...', 'text-green');

        camTimer = setInterval(async () => {
          if (!camStream || video.readyState < 2 || scanBusy) return;
          scanBusy = true;
          try {
            const found = await decodeFromImageSource(video);
            if (found) completeBarcodeScan(found);
          } finally {
            scanBusy = false;
          }
        }, 500);
      } catch (e) {
        setScanStatus('Kamera açılamadı; "Fotoğraf Çek / Seç" butonuna basarak barkod çekebilirsiniz.', 'text-amber');
      }
    }

    async function captureFrameAndDecode() {
      const video = document.getElementById('barcodeVideo');
      if (!video || video.readyState < 2) {
        toast('Kamera görüntüsü hazır değil; "Fotoğraf Çek / Seç" kullanabilirsiniz.', 'info');
        return;
      }
      setScanStatus('Kare taranıyor...', 'text-amber');
      const found = await decodeFromImageSource(video);
      if (found) completeBarcodeScan(found);
      else {
        setScanStatus('Karede barkod/karekod okunamadı; daha net hizalayın veya fotoğraf çekin.', 'text-red');
        toast('Barkod okunamadı, tekrar deneyin.', 'error');
      }
    }

    function handleBarcodePhoto(ev) {
      const file = ev.target.files?.[0];
      if (!file) return;
      setScanStatus('Fotoğraf taranıyor...', 'text-amber');
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = async () => {
          const found = await decodeFromImageSource(img);
          if (found) completeBarcodeScan(found);
          else {
            setScanStatus('Fotoğraftan kod okunamadı; numarayı aşağıya yazabilirsiniz.', 'text-red');
            const inp = document.getElementById('manualBarcodeInput');
            if (inp) inp.focus();
            toast('Kod otomatik okunamadı; numarayı manuel girebilirsiniz.', 'info');
          }
        };
        img.src = String(reader.result || '');
      };
      reader.readAsDataURL(file);
    }

    function stopCameraScan() {
      if (camTimer) { clearInterval(camTimer); camTimer = null; }
      if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }

      if (v) v.srcObject = null;

    function buildZReportData(dateStr) {
      const key = dateStr || zReportDate || toLocalDateKey(new Date());
      const daySales = state.sales.filter(s => s.status !== 'cancelled' && toLocalDateKey(s.createdAt) === key);
      const cancelledDaySales = state.sales.filter(s => s.status === 'cancelled' && toLocalDateKey(s.createdAt) === key);

      const breakdown = { nakit: 0, kredi_karti: 0, iban: 0, veresiye: 0 };
      const counts = { nakit: 0, kredi_karti: 0, iban: 0, veresiye: 0 };

      let grossTotal = 0;
      let totalDiscount = 0;
      let totalItems = 0;

      daySales.forEach(s => {
        const m = breakdown[s.paymentMethod] !== undefined ? s.paymentMethod : 'nakit';
        const amt = Number(s.total || 0);
        breakdown[m] += amt;
        counts[m] += 1;
        grossTotal += amt;
        totalDiscount += Number(s.discountAmount || 0);
        totalItems += (s.items || []).reduce((acc, it) => acc + Number(it.qty || 0), 0);
      });

      const dayCollections = state.transactions.filter(t => t.type === 'payment' && !t.isReversed && toLocalDateKey(t.createdAt) === key);
      const colNakit = dayCollections.filter(t => t.method === 'nakit').reduce((a, t) => a + Number(t.amount || 0), 0);
      const colIban = dayCollections.filter(t => t.method === 'iban').reduce((a, t) => a + Number(t.amount || 0), 0);
      const totalCollections = colNakit + colIban;

      const dayExpenses = state.expenses.filter(e => !e.isDeleted && e.date === key).reduce((a, e) => a + Number(e.amount || 0), 0);
      const cashInDrawer = breakdown.nakit + colNakit - dayExpenses;

      return {
        key, saleCount: daySales.length, cancelledCount: cancelledDaySales.length,
        totalItems, grossTotal, totalDiscount, breakdown, counts,
        colNakit, colIban, totalCollections, dayExpenses, cashInDrawer
      };
    }

    /* ================= GÜN VE HAFTA BAZLI SATIŞ RAPORU ================= */
    function getMonthDayAndWeekReport(year, month) {
      const daysInMonth = new Date(year, month, 0).getDate();
      const activeSales = state.sales.filter(s => {
        if (s.status === 'cancelled') return false;
        const d = new Date(s.createdAt);
        return d.getFullYear() === Number(year) && (d.getMonth() + 1) === Number(month);
      });

      const dayMap = {};
      for (let day = 1; day <= daysInMonth; day++) {
        dayMap[day] = { day, count: 0, qty: 0, total: 0, nakit: 0, kart: 0, iban: 0, veresiye: 0 };
      }

      const weeks = [
        { weekNo: 1, label: '1. Hafta (1–7)', range: '1 - 7', count: 0, qty: 0, total: 0 },
        { weekNo: 2, label: '2. Hafta (8–14)', range: '8 - 14', count: 0, qty: 0, total: 0 },
        { weekNo: 3, label: '3. Hafta (15–21)', range: '15 - 21', count: 0, qty: 0, total: 0 },
        { weekNo: 4, label: '4. Hafta (22–28)', range: '22 - 28', count: 0, qty: 0, total: 0 },
        { weekNo: 5, label: `5. Hafta (29–${daysInMonth})`, range: `29 - ${daysInMonth}`, count: 0, qty: 0, total: 0 }
      ];

      let monthTotal = 0, monthQty = 0, monthCount = 0;

      activeSales.forEach(s => {
        const d = new Date(s.createdAt);
        const day = d.getDate();
        const wIdx = Math.min(4, Math.floor((day - 1) / 7));
        const amt = Number(s.total || 0);
        const qty = (s.items || []).reduce((a, it) => a + Number(it.qty || 0), 0);

        dayMap[day].count += 1;
        dayMap[day].qty += qty;
        dayMap[day].total += amt;
        if (s.paymentMethod === 'nakit') dayMap[day].nakit += amt;
        else if (s.paymentMethod === 'kredi_karti') dayMap[day].kart += amt;
        else if (s.paymentMethod === 'iban') dayMap[day].iban += amt;
        else if (s.paymentMethod === 'veresiye') dayMap[day].veresiye += amt;

        weeks[wIdx].count += 1;
        weeks[wIdx].qty += qty;
        weeks[wIdx].total += amt;

        monthTotal += amt;
        monthQty += qty;
        monthCount += 1;
      });

      const activeWeeks = daysInMonth > 28 ? weeks : weeks.slice(0, 4);
      return { days: Object.values(dayMap), weeks: activeWeeks, monthTotal, monthQty, monthCount };
    }

    function getActiveSales() { return state.sales.filter(s => s.status !== 'cancelled'); }
    function isSameDay(iso) {
      const d = new Date(iso), n = new Date();
      return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    }
    function isWithinDays(iso, days) {
      const diff = Date.now() - new Date(iso).getTime();
      return diff >= 0 && diff <= days * 86400000;
    }
    function getTotalStock() {
      return state.products.reduce((a, p) => a + (p.variants || []).reduce((b, v) => b + Number(v.stock || 0), 0), 0);
    }
    function getCriticalItems() {
      const out = [];
      state.products.forEach(p => {
        const lim = Number(p.criticalStock ?? state.settings.defaultCriticalStock ?? 5);
        (p.variants || []).forEach(v => {
          if (Number(v.stock || 0) <= lim) out.push({ product: p, variant: v });
        });
      });
      return out;
    }

    function getFinance() {
      const sales = getActiveSales();
      const revenue = sales.reduce((a, s) => a + Number(s.total || 0), 0);
      const buyCost = sales.reduce((a, s) => a + (s.items || []).reduce((b, it) => b + Number(it.buyPrice || 0) * Number(it.qty || 0), 0), 0);
      const discounts = sales.reduce((a, s) => a + Number(s.discountAmount || 0), 0);
      const creditSales = sales.filter(s => s.paymentMethod === 'veresiye').reduce((a, s) => a + Number(s.total || 0), 0);
      const expenses = state.expenses.filter(e => !e.isDeleted).reduce((a, e) => a + Number(e.amount || 0), 0);
      const grossProfit = revenue - buyCost;
      const netProfit = revenue - buyCost - expenses;
      const collections = state.transactions.filter(t => t.type === 'payment' && !t.isReversed).reduce((a, t) => a + Number(t.amount || 0), 0);
      const customerDebt = state.customers.reduce((a, c) => a + Math.max(0, Number(c.balance || 0)), 0);

      const map = {};
      sales.forEach(s => {
        (s.items || []).forEach(it => {
          if (!map[it.productId]) map[it.productId] = { productId: it.productId, name: it.productName, qty: 0, profit: 0 };
          const rev = Number(it.lineTotal ?? Number(it.sellPrice || 0) * Number(it.qty || 0));
          const cst = Number(it.buyPrice || 0) * Number(it.qty || 0);
          map[it.productId].qty += Number(it.qty || 0);
          map[it.productId].profit += (rev - cst);
        });
      });
      const topQty = Object.values(map).sort((a, b) => b.qty - a.qty);
      const topProfit = Object.values(map).sort((a, b) => b.profit - a.profit);

      return { revenue, buyCost, discounts, creditSales, expenses, grossProfit, netProfit, collections, customerDebt, topQty, topProfit };
    }

    function saveNewProduct() {
      if (!isAdmin()) { toast('Yetkiniz yok!', 'error'); return; }
      const name = (document.getElementById('pName')?.value || '').trim();
      const cat = (document.getElementById('pCat')?.value || 'Genel').trim();
      const mod = (document.getElementById('pMod')?.value || '').trim();
      const buyPrice = Number(document.getElementById('pBuy')?.value || 0);
      const sellPrice = Number(document.getElementById('pSell')?.value || 0);
      const criticalStock = Number(document.getElementById('pCrit')?.value ?? state.settings.defaultCriticalStock);
      const size = (document.getElementById('pSize')?.value || 'Standart').trim();
      const color = (document.getElementById('pColor')?.value || 'Standart').trim();
      const barcode = (document.getElementById('pBarcode')?.value || '').trim();
      const stock = Math.max(0, parseInt(document.getElementById('pStock')?.value || '0', 10));

      if (!name) { toast('Ürün adı girin!', 'error'); return; }
      if (sellPrice <= 0) { toast('Satış fiyatı girin!', 'error'); return; }

      const pid = uid('prd');
      const vid = uid('var');
      state.products.unshift({
        id: pid, name, category: cat, model: mod, buyPrice, sellPrice, criticalStock, createdAt: nowISO(),
        variants: [{ id: vid, size, color, barcode, stock }]
      });
      if (stock > 0) {
        state.stockMovements.unshift({
          id: uid('stk'), productId: pid, productName: name, variantInfo: `${size}/${color}`,
          type: 'in', qtyChange: stock, reason: 'İlk stok girişi', userName: currentUser.name, createdAt: nowISO()
        });
      }
      logAction('Ürün Eklendi', `${name} (${size}/${color}) • Barkod: ${barcode || '-'} • Satış: ${formatTL(sellPrice)} • Stok: ${stock}`);
      saveState();
      render();
      toast('Ürün eklendi!', 'success');
    }

        (p.category || '').toLowerCase().includes(q) ||
        (p.variants || []).some(v => (v.barcode || '').toLowerCase().includes(q) || (v.size || '').toLowerCase().includes(q) || (v.color || '').toLowerCase().includes(q))
      );
      if (!list.length) {
        box.innerHTML = `<div class="card muted" style="text-align:center;">Kayıtlı ürün yok.</div>`;
        return;
      }
      box.innerHTML = list.map(p => {
        const tot = (p.variants || []).reduce((a, v) => a + Number(v.stock || 0), 0);
        return `
          <div class="card stack">
            <div class="row-between">
              <div>
                <div style="font-weight:800;font-size:15px;">${esc(p.name)}</div>
                <div class="muted">${esc(p.category || 'Genel')} ${p.model ? '• ' + esc(p.model) : ''}</div>
                <div class="row-gap" style="margin-top:6px;">
                  <span class="muted text-green" style="font-weight:700;">Satış: ${formatTL(p.sellPrice)}</span>
                  ${admin ? `<span class="muted">Alış: ${formatTL(p.buyPrice)}</span>` : ''}
                  <span class="muted text-blue" style="font-weight:700;">Toplam Stok: ${tot}</span>
                </div>
              </div>
              ${admin ? `
                <div class="row-gap">
                  <button onclick="addVar('${p.id}')" class="btn btn-secondary btn-sm">+ Varyant</button>

                  <button onclick="delProd('${p.id}')" class="btn btn-danger btn-sm">Sil</button>

              ` : ''}
            </div>
            ${(p.variants || []).map(v => `
              <div class="sub-box row-between">
                <div>
                  <strong style="font-size:13px;">${esc(v.size)} • ${esc(v.color)}</strong>
                  <div class="muted">${v.barcode ? 'Barkod: ' + esc(v.barcode) + ' • ' : ''}Stok: <strong>${v.stock}</strong></div>

                <div class="row-gap">
                  <button onclick="addToCart('${p.id}','${v.id}'); goTab('pos');" class="btn btn-primary btn-sm">Sat</button>

                    <button onclick="stockMove('${p.id}','${v.id}','in')" class="btn btn-success btn-sm">+ Giriş</button>
                    <button onclick="stockMove('${p.id}','${v.id}','count')" class="btn btn-secondary btn-sm">Sayım</button>
                  ` : ''}
                </div>

            `).join('')}
