    function addVar(pid) {
      if (!isAdmin()) return toast('Yetkiniz yok!', 'error');
      const p = state.products.find(x => x.id === pid);
      if (!p) return;
      const size = (prompt('Beden:', 'L') || '').trim();
      if (!size) return;
      const color = (prompt('Renk:', 'Siyah') || 'Standart').trim();
      const barcode = (prompt('Barkod:', '') || '').trim();
      const stock = Math.max(0, parseInt(prompt('Stok adedi:', '1') || '0', 10));
      p.variants.push({ id: uid('var'), size, color, barcode, stock });
      if (stock > 0) {
        state.stockMovements.unshift({
          id: uid('stk'), productId: p.id, productName: p.name, variantInfo: `${size}/${color}`,
          type: 'in', qtyChange: stock, reason: 'Yeni varyant girişi', userName: currentUser.name, createdAt: nowISO()
        });
      }
      logAction('Varyant Eklendi', `${p.name} -> ${size}/${color} (${stock})`);
      saveState(); render(); toast('Varyant eklendi.', 'success');
    }

    function editProd(pid) {
      if (!isAdmin()) return toast('Yetkiniz yok!', 'error');
      const p = state.products.find(x => x.id === pid);
      if (!p) return;
      const name = prompt('Ürün adı:', p.name);
      if (!name || !name.trim()) return;
      const sell = Number(prompt('Satış fiyatı (TL):', String(p.sellPrice)));
      const buy = Number(prompt('Alış fiyatı (TL):', String(p.buyPrice)));
      if (isNaN(sell) || sell <= 0 || isNaN(buy) || buy < 0) return toast('Geçersiz fiyat!', 'error');
      p.name = name.trim(); p.sellPrice = sell; p.buyPrice = buy;
      logAction('Ürün Düzenlendi', `${p.name} • Satış: ${formatTL(sell)} • Alış: ${formatTL(buy)}`);
      saveState(); render(); toast('Güncellendi.', 'success');
    }

    function delProd(pid) {
      if (!isAdmin()) return toast('Yetkiniz yok!', 'error');
      const p = state.products.find(x => x.id === pid);
      if (!p || !confirm(`"${p.name}" silinsin mi?`)) return;
      state.products = state.products.filter(x => x.id !== pid);
      logAction('Ürün Silindi', p.name);
      saveState(); render(); toast('Silindi.', 'success');
    }

    function stockMove(pid, vid, mode) {
      if (!isAdmin()) return toast('Yetkiniz yok!', 'error');
      const p = state.products.find(x => x.id === pid);
      const v = p?.variants?.find(x => x.id === vid);
      if (!p || !v) return;
      const oldS = Number(v.stock || 0);
      if (mode === 'in') {
        const add = parseInt(prompt(`${p.name} (${v.size}/${v.color}) eklenecek adet:`, '1') || '0', 10);
        if (isNaN(add) || add <= 0) return;
        v.stock = oldS + add;
        state.stockMovements.unshift({ id: uid('stk'), productId: p.id, productName: p.name, variantInfo: `${v.size}/${v.color}`, type: 'in', qtyChange: add, reason: 'Stok girişi', userName: currentUser.name, createdAt: nowISO() });
        logAction('Stok Girişi', `${p.name} (${v.size}/${v.color}): +${add}`);
      } else {
        const cnt = parseInt(prompt(`Yeni sayım adedi (Mevcut: ${oldS}):`, String(oldS)) || '', 10);
        if (isNaN(cnt) || cnt < 0) return;
        const diff = cnt - oldS;
        v.stock = cnt;
        state.stockMovements.unshift({ id: uid('stk'), productId: p.id, productName: p.name, variantInfo: `${v.size}/${v.color}`, type: 'count', qtyChange: diff, reason: `Sayım (${oldS}->${cnt})`, userName: currentUser.name, createdAt: nowISO() });
        logAction('Stok Sayımı', `${p.name} (${v.size}/${v.color}): ${oldS}->${cnt}`);
      }
      saveState(); render(); toast('Stok güncellendi.', 'success');
    }

    function viewPOS() {
      const sub = cart.reduce((a, i) => a + Number(i.sellPrice) * Number(i.qty), 0);
      const dAmt = discType === 'percent' ? sub * (Math.max(0, Number(discVal || 0)) / 100) : Math.min(sub, Math.max(0, Number(discVal || 0)));
      const tot = Math.max(0, sub - dAmt);

      const rows = [];
      state.products.forEach(p => (p.variants || []).forEach(v => {
        rows.push(`
          <div class="sub-box row-between" style="margin-top:0;margin-bottom:8px;">
            <div>
              <div style="font-weight:700;font-size:13px;">${esc(p.name)}</div>
              <div class="muted">${esc(v.size)} • ${esc(v.color)} ${v.barcode ? '• ' + esc(v.barcode) : ''} • Stok: ${v.stock}</div>
              <div class="text-green" style="font-size:12px;font-weight:700;">${formatTL(p.sellPrice)}</div>
            </div>
            <button onclick="addToCart('${p.id}','${v.id}')" class="btn btn-primary btn-sm">+ Ekle</button>
          </div>
        `);
      }));

      return `
        <div class="row-between">
          <h2 class="title-lg">Satış Ekranı</h2>
          <div class="row-gap">
            <button onclick="openZReportModal(toLocalDateKey(new Date()))" class="btn btn-secondary btn-sm">Gün Sonu Z</button>
            <button onclick="openBarcodeModal(c=>{ const f=findVariantByBarcode(c); if(!f) toast('Barkod bulunamadı: '+c,'error'); else addToCart(f.product.id,f.variant.id); }, 'Satış barkodu veya karekodu okut')" class="btn btn-warning btn-sm">Barkod Okut</button>
          </div>
        </div>

        <div class="pos-layout">
          <div class="card">
            <div class="title-md">Ürünler</div>
            ${rows.length ? rows.join('') : `<div class="muted">Henüz ürün yok. Stok sekmesinden ürün ekleyin.</div>`}
          </div>

          <div class="card stack">
            <div class="row-between">
              <div class="title-md" style="margin:0;">Sepet (${cart.reduce((a,b)=>a+b.qty,0)})</div>
              ${cart.length ? `<button onclick="cart=[];discVal=0;render();" class="btn btn-secondary btn-sm">Temizle</button>` : ''}
            </div>

            ${cart.length ? cart.map((it, idx) => `
              <div class="sub-box row-between" style="margin-top:0;">
                <div>
                  <div style="font-weight:700;font-size:13px;">${esc(it.productName)}</div>
                  <div class="muted">${esc(it.size)}/${esc(it.color)} • ${formatTL(it.sellPrice)}</div>
                </div>
                <div class="row-gap">
                  <button onclick="chgQty(${idx},-1)" class="btn btn-secondary btn-sm">-</button>
                  <strong>${it.qty}</strong>
                  <button onclick="chgQty(${idx},1)" class="btn btn-secondary btn-sm">+</button>
                  <button onclick="cart.splice(${idx},1);render();" class="btn btn-danger btn-sm">&times;</button>
                </div>
              </div>
            `).join('') : `<div class="muted">Sepet boş.</div>`}

            <div>
              <label class="lbl">İndirim (${!isAdmin() ? 'Personel max %' + state.settings.maxStaffDiscount : 'Yönetici'})</label>
              <div class="row-gap">
                <select id="dType" onchange="onDiscChange()" class="input" style="width:120px;">
                  <option value="percent" ${discType==='percent'?'selected':''}>Yüzde (%)</option>
                  <option value="amount" ${discType==='amount'?'selected':''}>Tutar (TL)</option>
                </select>
                <input id="dVal" type="number" step="0.01" value="${discVal}" onchange="onDiscChange()" class="input" style="flex:1;" />
              </div>
            </div>

            <div>
              <label class="lbl">Müşteri (Veresiye satışta zorunlu)</label>
              <select id="posCust" onchange="selectedCustId=this.value" class="input">
                <option value="">-- Müşteri Seçin --</option>
                ${state.customers.map(c => `<option value="${c.id}" ${selectedCustId===c.id?'selected':''}>${esc(c.fullName)} (Borç: ${formatTL(c.balance)})</option>`).join('')}
              </select>
            </div>

            <div class="sub-box stack">
              <div class="row-between"><span class="muted">Ara Toplam</span><span>${formatTL(sub)}</span></div>
              <div class="row-between"><span class="text-amber">İndirim</span><span class="text-amber">-${formatTL(dAmt)}</span></div>
              <div class="row-between" style="font-size:17px;font-weight:800;"><span>Toplam</span><span class="text-green">${formatTL(tot)}</span></div>
            </div>

            <div class="grid-2">
              <button onclick="finishSale('nakit')" class="btn btn-success">Nakit</button>
              <button onclick="finishSale('kredi_karti')" class="btn btn-primary">Kredi Kartı</button>
              <button onclick="finishSale('iban')" class="btn btn-secondary">IBAN</button>
              <button onclick="finishSale('veresiye')" class="btn btn-warning">Veresiye</button>
            </div>
          </div>
        </div>
      `;
    }

    function addToCart(pid, vid) {
      const p = state.products.find(x => x.id === pid);
      const v = p?.variants?.find(x => x.id === vid);
      if (!p || !v) return;
      if (Number(v.stock || 0) <= 0) { toast('Stok tükendi!', 'error'); return; }
      const ex = cart.find(c => c.variantId === vid);
      if (ex) {
        if (ex.qty + 1 > Number(v.stock)) { toast('Yetersiz stok!', 'error'); return; }
        ex.qty += 1;
      } else {
        cart.push({ productId: p.id, productName: p.name, variantId: v.id, size: v.size, color: v.color, buyPrice: Number(p.buyPrice || 0), sellPrice: Number(p.sellPrice || 0), qty: 1 });
      }
      render();
      toast(p.name + ' sepete eklendi.', 'success');
    }

    function chgQty(idx, d) {
      const it = cart[idx];
      if (!it) return;
      const p = state.products.find(x => x.id === it.productId);
      const v = p?.variants?.find(x => x.id === it.variantId);
      const maxS = Number(v?.stock ?? it.qty);
      const next = it.qty + d;
      if (next <= 0) cart.splice(idx, 1);
      else if (next > maxS) return toast('Stok sınırını aştınız!', 'error');
      else it.qty = next;
      render();
    }

    async function onDiscChange() {
      const t = document.getElementById('dType')?.value || 'percent';
      const val = Math.max(0, Number(document.getElementById('dVal')?.value || 0));
      const sub = cart.reduce((a, i) => a + Number(i.sellPrice) * Number(i.qty), 0);
      const pct = t === 'percent' ? val : (sub > 0 ? (val / sub) * 100 : 0);
      const lim = Number(state.settings.maxStaffDiscount ?? 20);
      if (!isAdmin() && pct > lim) {
        const ok = await requestPin('Yönetici İndirim Onayı', `Personel max %${lim} indirim yapabilir. %${pct.toFixed(1)} indirim için yönetici PIN girin.`);
        if (!ok) { discVal = 0; render(); return; }
      }
      discType = t; discVal = val; render();
    }

    async function finishSale(method) {
      if (!cart.length) { toast('Sepet boş!', 'error'); return; }
      const sub = cart.reduce((a, i) => a + Number(i.sellPrice) * Number(i.qty), 0);
      const dAmt = discType === 'percent' ? sub * (Math.max(0, Number(discVal || 0)) / 100) : Math.min(sub, Math.max(0, Number(discVal || 0)));
      const pct = sub > 0 ? (dAmt / sub) * 100 : 0;
      const lim = Number(state.settings.maxStaffDiscount ?? 20);
      if (!isAdmin() && pct > lim) {
        const ok = await requestPin('Yönetici İndirim Onayı', `%${lim} üzeri indirim için yönetici PIN girin.`);
        if (!ok) return;
      }
      const tot = Math.max(0, sub - dAmt);
      const custId = (document.getElementById('posCust')?.value || selectedCustId || '').trim();
      const cust = custId ? state.customers.find(c => c.id === custId) : null;
      if (method === 'veresiye' && !cust) { toast('Veresiye satış için müşteri seçin!', 'error'); return; }

      for (const it of cart) {
        const p = state.products.find(x => x.id === it.productId);
        const v = p?.variants?.find(x => x.id === it.variantId);
        if (!v || Number(v.stock) < it.qty) { toast('Yetersiz stok: ' + it.productName, 'error'); return; }
      }

      const sid = uid('sal');
      const createdAt = nowISO();
      const items = cart.map(it => {
        const gross = Number(it.sellPrice) * Number(it.qty);
        const share = sub > 0 ? gross / sub : 0;
        return { ...it, lineTotal: Math.max(0, gross - dAmt * share) };
      });

      items.forEach(it => {
        const p = state.products.find(x => x.id === it.productId);
        const v = p?.variants?.find(x => x.id === it.variantId);
        if (v) {
          v.stock = Number(v.stock) - Number(it.qty);
          state.stockMovements.unshift({ id: uid('stk'), productId: p.id, productName: p.name, variantInfo: `${v.size}/${v.color}`, type: 'out', qtyChange: -Number(it.qty), reason: `Satış #${sid.slice(-5)}`, userName: currentUser.name, createdAt });
        }
      });

      state.sales.unshift({
        id: sid, userId: currentUser.id, userName: currentUser.name,
        customerId: cust ? cust.id : null, customerName: cust ? cust.fullName : null,
        items, subtotal: sub, discountType: discType, discountValue: Number(discVal || 0),
        discountAmount: dAmt, total: tot, paymentMethod: method, status: 'completed', stockRestored: false, createdAt
      });

      if (method === 'veresiye' && cust) {
        cust.balance = Number(cust.balance || 0) + tot;
        state.transactions.unshift({ id: uid('trn'), customerId: cust.id, customerName: cust.fullName, saleId: sid, type: 'debt', amount: tot, method: 'veresiye', note: `Veresiye satış #${sid.slice(-5)}`, isReversed: false, createdAt });
      }

      logAction('Satış Yapıldı', `#${sid.slice(-5)} • ${formatTL(tot)} • ${method}${cust ? ' • ' + cust.fullName : ''}`);
      cart = []; discVal = 0; selectedCustId = '';
      saveState(); render(); toast('Satış tamamlandı: ' + formatTL(tot), 'success');
    }

    function viewCustomers() {
      const totDebt = state.customers.reduce((a, c) => a + Math.max(0, Number(c.balance || 0)), 0);
      return `
        <div class="row-between">
          <div><h2 class="title-lg">Müşteri ve Veresiye</h2><div class="muted text-amber">Toplam Borç: ${formatTL(totDebt)}</div></div>
          <button onclick="addCust()" class="btn btn-primary btn-sm">+ Yeni Müşteri</button>
        </div>
        ${state.customers.length ? state.customers.map(c => {
          const bal = Math.max(0, Number(c.balance || 0));
          const isPaidOff = bal <= 0;
          const trns = state.transactions.filter(t => t.customerId === c.id && !t.isReversed);
          const msg = encodeURIComponent(`Sayın ${c.fullName}, ${state.settings.storeName} hesabınızdaki güncel veresiye borcunuz ${formatTL(bal)} tutarındadır.`);
          const wa = `https://wa.me/${String(c.phone || '').replace(/\D/g,'')}?text=${msg}`;
          return `
            <div class="card stack">
              <div class="row-between">
                <div>
                  <div style="font-weight:800;font-size:15px;">${esc(c.fullName)} ${isPaidOff ? '<span class="badge" style="background:#059669;margin-left:6px;">BORÇ BİTTİ</span>' : ''}</div>
                  <div class="muted">Tel: ${esc(c.phone || '-')}</div>
                </div>
                <div style="text-align:right;"><div class="muted">Kalan Borç</div><div class="val-lg ${bal>0?'text-red':'text-green'}">${formatTL(bal)}</div></div>
              </div>

              <div class="sub-box" style="margin-top:0;">
                <label class="lbl">Güncel Borç Notu</label>
                <div class="row-gap">
                  <input id="custNote_${c.id}" type="text" value="${esc(c.notes || '')}" placeholder="Örn: Ayın 15'inde ödeyecek, kalan 200 TL..." class="input" style="flex:1;padding:8px 11px;font-size:13px;" onkeydown="if(event.key==='Enter') saveCustomerNote('${c.id}')" />
                  <button onclick="saveCustomerNote('${c.id}')" class="btn btn-secondary btn-sm">Notu Kaydet</button>
                </div>
              </div>

              <div class="row-gap">
                ${bal > 0 ? `<button onclick="collectDebt('${c.id}',false)" class="btn btn-success btn-sm">Tahsilat Al</button>` : ''}
                ${bal > 0 ? `<button onclick="collectDebt('${c.id}',true)" class="btn btn-primary btn-sm">Borcu Kapat</button>` : ''}
                <a href="${wa}" target="_blank" class="btn btn-warning btn-sm">Hatırlatma Hazırla</a>
                ${isPaidOff ? `<button onclick="deleteSettledCustomer('${c.id}')" class="btn btn-danger btn-sm">Listeden Sil</button>` : ''}
              </div>

              ${trns.length ? trns.slice(0,5).map(t => `
                <div class="list-item" style="font-size:12px;">
                  <span>${formatDT(t.createdAt)} • ${t.type==='payment'?'Tahsilat ('+t.method+')':'Veresiye'}</span>
                  <div class="row-gap">
                    <strong class="${t.type==='payment'?'text-green':'text-amber'}">${t.type==='payment'?'-':'+'}${formatTL(t.amount)}</strong>
                    ${(isAdmin() && t.type==='payment') ? `<button onclick="revTrn('${t.id}')" class="btn btn-danger btn-sm">Düzelt</button>` : ''}
                  </div>
                </div>
              `).join('') : `<div class="muted">Hareket yok.</div>`}
            </div>
          `;
        }).join('') : `<div class="card muted" style="text-align:center;">Kayıtlı müşteri yok.</div>`}
      `;
    }

    function addCust() {
      const fullName = (prompt('Ad Soyad:') || '').trim();
      if (!fullName) return;
      const phone = (prompt('Telefon:') || '').trim();
      const notes = (prompt('Güncel borç notu (isteğe bağlı):', '') || '').trim();
      state.customers.unshift({ id: uid('cst'), fullName, phone, notes, balance: 0, createdAt: nowISO() });
      logAction('Müşteri Eklendi', fullName);
      saveState(); render(); toast('Müşteri eklendi.', 'success');
    }

    function saveCustomerNote(cid) {
      const c = state.customers.find(x => x.id === cid);
      if (!c) return;
      const inp = document.getElementById('custNote_' + cid);
      const val = (inp ? inp.value : '').trim();
      c.notes = val;
      logAction('Borç Notu Güncellendi', `${c.fullName}: ${val || '(boş)'}`);
      saveState(); render(); toast('Borç notu kaydedildi.', 'success');
    }

    function deleteSettledCustomer(cid) {
      const c = state.customers.find(x => x.id === cid);
      if (!c) return;
      const bal = Math.max(0, Number(c.balance || 0));
      if (bal > 0) {
        toast('Müşterinin henüz kapanmamış borcu var (' + formatTL(bal) + ').', 'error');
        return;
      }
      if (!confirm(`${c.fullName} adlı müşterinin borcu bitti; listeden silinsin mi?`)) return;
      state.customers = state.customers.filter(x => x.id !== cid);
      if (selectedCustId === cid) selectedCustId = '';
      logAction('Borcu Kapanan Müşteri Silindi', c.fullName);
      saveState(); render(); toast(`${c.fullName} listeden silindi.`, 'success');
    }

    function collectDebt(cid, full) {
      const c = state.customers.find(x => x.id === cid);
      if (!c) return;
      const bal = Math.max(0, Number(c.balance || 0));
      if (bal <= 0) return toast('Borç bulunmuyor.', 'info');
      let amt = bal;
      if (!full) {
        amt = Math.min(bal, Number(prompt(`Kalan borç: ${formatTL(bal)}\nTahsilat tutarı:`, String(bal)) || 0));
      }
      if (isNaN(amt) || amt <= 0) return;
      const m = ((prompt('Yöntem (nakit / iban):', 'nakit') || 'nakit').toLowerCase().includes('iban')) ? 'iban' : 'nakit';
      const newBal = Math.max(0, bal - amt);
      c.balance = newBal;
      if (newBal === 0) c.notes = '';
      state.transactions.unshift({ id: uid('trn'), customerId: c.id, customerName: c.fullName, saleId: null, type: 'payment', amount: amt, method: m, note: full || newBal === 0 ? 'Borç kapatma' : 'Kısmi tahsilat', isReversed: false, createdAt: nowISO() });
      logAction('Tahsilat Alındı', `${c.fullName}: ${formatTL(amt)} (${m})`);
      saveState(); render();
      toast(newBal === 0 ? `${c.fullName} borcunu tamamen ödedi! İsterseniz listeden silebilirsiniz.` : 'Tahsilat kaydedildi.', 'success');
    }

    function revTrn(tid) {
      if (!isAdmin()) return toast('Yetkiniz yok!', 'error');
      const t = state.transactions.find(x => x.id === tid);
      if (!t || t.isReversed || t.type !== 'payment' || !confirm('Tahsilat düzeltilsin mi?')) return;
      const c = state.customers.find(x => x.id === t.customerId);
      if (c) c.balance = Number(c.balance || 0) + Number(t.amount || 0);
      t.isReversed = true;
      logAction('Tahsilat Düzeltildi', `${t.customerName}: ${formatTL(t.amount)}`);
      saveState(); render(); toast('Tahsilat düzeltildi.', 'success');
    }

    function viewExpenses() {
      const list = state.expenses.filter(e => !e.isDeleted);
      const tot = list.reduce((a, e) => a + Number(e.amount || 0), 0);
      return `
        <div class="row-between"><h2 class="title-lg">Gider Yönetimi</h2><div class="text-red" style="font-weight:800;">Toplam: ${formatTL(tot)}</div></div>
        <div class="card stack">
          <div class="grid-4">
            <select id="expCat" class="input"><option>Kira</option><option>Elektrik ve Su</option><option>Personel Gideri</option><option>İşletme Gideri</option><option>Diğer</option></select>
            <input id="expAmt" type="number" step="0.01" placeholder="Tutar (TL)" class="input" />
            <input id="expDate" type="date" value="${toLocalDateKey(new Date())}" class="input" />
            <input id="expNote" type="text" placeholder="Açıklama" class="input" />
          </div>
          <button onclick="addExp()" class="btn btn-danger btn-sm">Gider Ekle</button>
        </div>
        <div class="card">
          ${list.length ? list.map(e => `
            <div class="list-item">
              <div><strong>${esc(e.category)}</strong> <span class="muted">(${esc(e.date)})</span><div class="muted">${esc(e.note || '')}</div></div>
              <div class="row-gap">
                <strong class="text-red">${formatTL(e.amount)}</strong>
                <button onclick="editExp('${e.id}')" class="btn btn-secondary btn-sm">Düzenle</button>
                <button onclick="delExp('${e.id}')" class="btn btn-danger btn-sm">Sil</button>
              </div>
            </div>
          `).join('') : `<div class="muted">Gider kaydı yok.</div>`}
        </div>
      `;
    }

    function addExp() {
      if (!isAdmin()) return;
      const category = document.getElementById('expCat').value;
      const amount = Number(document.getElementById('expAmt').value || 0);
      const date = document.getElementById('expDate').value;
      const note = (document.getElementById('expNote').value || '').trim();
      if (isNaN(amount) || amount <= 0) return toast('Geçerli tutar girin!', 'error');
      state.expenses.unshift({ id: uid('exp'), category, amount, date, note, isDeleted: false, createdAt: nowISO() });
      logAction('Gider Eklendi', `${category}: ${formatTL(amount)}`);
      saveState(); render(); toast('Gider eklendi.', 'success');
    }

    function editExp(id) {
      const e = state.expenses.find(x => x.id === id);
      if (!e) return;
      const amt = Number(prompt('Yeni tutar (TL):', String(e.amount)));
      if (isNaN(amt) || amt <= 0) return;
      e.amount = amt;
      logAction('Gider Düzenlendi', `${e.category}: ${formatTL(amt)}`);
      saveState(); render(); toast('Güncellendi.', 'success');
    }

    function delExp(id) {
      const e = state.expenses.find(x => x.id === id);
      if (!e || !confirm('Gider silinsin mi?')) return;
      e.isDeleted = true;
      logAction('Gider Silindi', `${e.category}: ${formatTL(e.amount)}`);
      saveState(); render(); toast('Silindi.', 'success');
    }

    function viewReports() {
      const fin = getFinance();
      const sales = getActiveSales();
      const dRev = sales.filter(s => isSameDay(s.createdAt)).reduce((a, s) => a + Number(s.total || 0), 0);
      const wRev = sales.filter(s => isWithinDays(s.createdAt, 7)).reduce((a, s) => a + Number(s.total || 0), 0);
      const mRev = sales.filter(s => isWithinDays(s.createdAt, 30)).reduce((a, s) => a + Number(s.total || 0), 0);
      const mRep = getMonthDayAndWeekReport(reportYear, reportMonth);

      const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
      const years = [reportYear - 1, reportYear, reportYear + 1];

      return `
        <div class="row-between">
          <h2 class="title-lg">Raporlar, Gün/Hafta Analizi & Kâr</h2>
          <button onclick="openZReportModal(toLocalDateKey(new Date()))" class="btn btn-success btn-sm">Gün Sonu Z Raporu</button>
        </div>

        <div class="card stack">
          <div class="row-between">
            <div>
              <div class="title-md" style="margin:0;">Haftalık ve Günlük Satış Raporu</div>
              <div class="muted">Seçilen ayın hangi haftasında ve hangi gününde ne kadar satış yapıldığını görün.</div>
            </div>
            <div class="row-gap">
              <select class="input" style="width:130px;" onchange="reportMonth=Number(this.value); render();">
                ${monthNames.map((mName, idx) => `<option value="${idx+1}" ${reportMonth===idx+1?'selected':''}>${mName}</option>`).join('')}
              </select>
              <select class="input" style="width:100px;" onchange="reportYear=Number(this.value); render();">
                ${years.map(y => `<option value="${y}" ${reportYear===y?'selected':''}>${y}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="grid-3">
            <div class="sub-box" style="margin-top:0;"><div class="muted">${monthNames[reportMonth-1]} ${reportYear} Toplam Satış</div><div class="val-lg text-green">${formatTL(mRep.monthTotal)}</div></div>
            <div class="sub-box" style="margin-top:0;"><div class="muted">Toplam İşlem</div><div class="val-lg text-blue">${mRep.monthCount} Satış</div></div>
            <div class="sub-box" style="margin-top:0;"><div class="muted">Toplam Satılan Adet</div><div class="val-lg text-amber">${mRep.monthQty} Adet</div></div>
          </div>

          <div class="title-md" style="margin-top:6px;">Haftalık Satış Kırılımı</div>
          <div class="grid-2">
            ${mRep.weeks.map(w => `
              <div class="sub-box" style="margin-top:0;">
                <div class="row-between">
                  <strong>${esc(w.label)}</strong>
                  <span class="muted">${w.count} satış • ${w.qty} adet</span>
                </div>
                <div class="val-lg text-green">${formatTL(w.total)}</div>
              </div>
            `).join('')}
          </div>

          <div class="title-md" style="margin-top:6px;">Günlük Satış Kırılımı (1–${mRep.days.length})</div>
          <div class="table-wrap">
            <table class="rep-table">
              <thead>
                <tr>
                  <th>Gün</th>
                  <th>Satış</th>
                  <th>Adet</th>
                  <th>Nakit</th>
                  <th>Kart</th>
                  <th>IBAN</th>
                  <th>Veresiye</th>
                  <th>Günlük Toplam</th>
                </tr>
              </thead>
              <tbody>
                ${mRep.days.map(d => {
                  const dateKey = `${reportYear}-${String(reportMonth).padStart(2,'0')}-${String(d.day).padStart(2,'0')}`;
                  return `
                    <tr>
                      <td><strong>${d.day} ${esc(monthNames[reportMonth-1].slice(0,3))}</strong> <button onclick="openZReportModal('${dateKey}')" class="chip" style="margin-left:4px;">Z</button></td>
                      <td>${d.count}</td>
                      <td>${d.qty}</td>
                      <td>${formatTL(d.nakit)}</td>
                      <td>${formatTL(d.kart)}</td>
                      <td>${formatTL(d.iban)}</td>
                      <td>${formatTL(d.veresiye)}</td>
                      <td><strong class="${d.total>0?'text-green':'muted'}">${formatTL(d.total)}</strong></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="grid-3">
          <div class="card"><div class="muted">Bugünkü Ciro</div><div class="val-lg text-green">${formatTL(dRev)}</div></div>
          <div class="card"><div class="muted">Son 7 Gün Ciro</div><div class="val-lg text-blue">${formatTL(wRev)}</div></div>
          <div class="card"><div class="muted">Son 30 Gün Ciro</div><div class="val-lg text-amber">${formatTL(mRev)}</div></div>
        </div>
        <div class="grid-4">
          <div class="card"><div class="muted">Satış Geliri</div><div class="val-lg text-white">${formatTL(fin.revenue)}</div></div>
          <div class="card"><div class="muted">Alış Maliyeti</div><div class="val-lg text-amber">${formatTL(fin.buyCost)}</div></div>
          <div class="card"><div class="muted">İşletme Giderleri</div><div class="val-lg text-red">${formatTL(fin.expenses)}</div></div>
          <div class="card"><div class="muted">Net Kâr</div><div class="val-lg ${fin.netProfit>=0?'text-green':'text-red'}">${formatTL(fin.netProfit)}</div></div>
        </div>
        <div class="grid-4">
          <div class="card"><div class="muted">Brüt Kâr</div><div class="val-lg text-green">${formatTL(fin.grossProfit)}</div></div>
          <div class="card"><div class="muted">İndirim Etkisi</div><div class="val-lg text-amber">-${formatTL(fin.discounts)}</div></div>
          <div class="card"><div class="muted">Veresiye Satış</div><div class="val-lg text-white">${formatTL(fin.creditSales)}</div></div>
          <div class="card"><div class="muted">Toplam Tahsilat</div><div class="val-lg text-blue">${formatTL(fin.collections)}</div></div>
        </div>
        <div class="card">
          <div class="title-md">En Çok Kazandıran Ürünler</div>
          ${fin.topProfit.length ? fin.topProfit.slice(0,6).map(p => `<div class="list-item"><span>${esc(p.name)} (${p.qty} adet)</span><strong class="text-green">${formatTL(p.profit)}</strong></div>`).join('') : `<div class="muted">Veri yok.</div>`}
        </div>
      `;
    }

    function viewHistory() {
      return `
        <h2 class="title-lg">Satış Geçmişi, İptal, Silme ve İşlem Kayıtları</h2>
        <div class="card stack">
          <div class="title-md">Satışlar (${state.sales.length})</div>
          ${state.sales.length ? state.sales.map(s => {
            const c = s.status === 'cancelled';
            return `
              <div class="sub-box">
                <div class="row-between">
                  <div><strong>#${esc(s.id.slice(-5))}</strong> <span class="muted">${formatDT(s.createdAt)}</span> <span class="badge" style="background:${c?'#dc2626':'#059669'};">${c?'İPTAL':'TAMAM'}</span></div>
                  <div class="row-gap">
                    <strong>${formatTL(s.total)} (${s.paymentMethod})</strong>
                    ${!c ? `<button onclick="cancelSale('${s.id}')" class="btn btn-warning btn-sm">İptal Et</button>` : ''}
                    <button onclick="deleteSale('${s.id}')" class="btn btn-danger btn-sm">Sil</button>
                  </div>
                </div>
                <div class="muted" style="margin-top:4px;">${(s.items||[]).map(i=>`${esc(i.productName)} x${i.qty}`).join(', ')} • ${esc(s.userName)}</div>
              </div>
            `;
          }).join('') : `<div class="muted">Satış yok.</div>`}
        </div>

        <div class="card stack">
          <div class="title-md">İşlem Geçmişi</div>
          ${state.auditLogs.slice(0,25).map(l => `
            <div class="list-item" style="font-size:12px;">
              <div><strong>${esc(l.action)}</strong>: ${esc(l.detail)} <div class="muted">${esc(l.userName)}</div></div>
              <span class="muted">${formatDT(l.createdAt)}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function restoreSaleEffects(s) {
      if (!s || s.stockRestored) return;
      (s.items || []).forEach(it => {
        const p = state.products.find(x => x.id === it.productId);
        const v = p?.variants?.find(x => x.id === it.variantId);
        if (v) {
          v.stock = Number(v.stock || 0) + Number(it.qty || 0);
          state.stockMovements.unshift({
            id: uid('stk'), productId: p.id, productName: p.name, variantInfo: `${v.size}/${v.color}`,
            type: 'return', qtyChange: Number(it.qty || 0), reason: `Satış geri alma #${s.id.slice(-5)}`,
            userName: currentUser ? currentUser.name : 'Sistem', createdAt: nowISO()
          });
        }
      });
      if (s.paymentMethod === 'veresiye' && s.customerId) {
        const cust = state.customers.find(c => c.id === s.customerId);
        if (cust) cust.balance = Math.max(0, Number(cust.balance || 0) - Number(s.total || 0));
        state.transactions.forEach(t => { if (t.saleId === s.id && t.type === 'debt') t.isReversed = true; });
      }
      s.stockRestored = true;
    }

    function cancelSale(sid) {
      if (!isAdmin()) return;
      const s = state.sales.find(x => x.id === sid);
      if (!s || s.status === 'cancelled' || s.stockRestored) return toast('Bu satış zaten iptal edilmiş!', 'error');
      if (!confirm('Satış iptal edilsin ve stoklar geri eklensin mi?')) return;
      restoreSaleEffects(s);
      s.status = 'cancelled';
      logAction('Satış İptal Edildi', `#${s.id.slice(-5)}`);
      saveState(); render(); toast('Satış iptal edildi.', 'success');
    }

    async function deleteSale(sid) {
      const ok = await requestPin('Satış Silme Onayı', 'Satış kaydını kalıcı olarak silmek için yönetici PIN girin.');
      if (!ok) return;
      const s = state.sales.find(x => x.id === sid);
      if (!s) return;
      const restoreStock = (s.status !== 'cancelled' && !s.stockRestored)
        ? confirm(`#${s.id.slice(-5)} satışını silerken ürün stokları ve veresiye borcu geri alınsın mı?`)
        : false;
      if (restoreStock) restoreSaleEffects(s);
      state.sales = state.sales.filter(x => x.id !== sid);
      logAction('Satış Silindi', `#${s.id.slice(-5)} • ${formatTL(s.total)}${restoreStock ? ' (Stok/Borç geri alındı)' : ''}`);
      saveState(); render(); toast('Satış kaydı silindi.', 'success');
    }

    function viewSettings() {
      const adm = state.users.find(u => u.role === 'admin') || state.users[0];
      return `
        <h2 class="title-lg">Uygulama Ayarları</h2>
        <div class="card stack">
          <div class="title-md">Mağaza ve Güvenlik</div>
          <div class="grid-3">
            <div><label class="lbl">Mağaza Adı</label><input id="sName" type="text" value="${esc(state.settings.storeName)}" class="input" /></div>
            <div><label class="lbl">Logo Kısaltma</label><input id="sLogo" type="text" maxlength="4" value="${esc(state.settings.storeLogoText)}" class="input" /></div>
            <div><label class="lbl">Yönetici PIN</label><input id="sPin" type="text" value="${esc(adm?.pin || '1234')}" class="input" /></div>
          </div>
          <div class="grid-3">
            <div><label class="lbl">Para Birimi</label><input type="text" value="TL" disabled class="input" /></div>
            <div><label class="lbl">Kritik Stok</label><input id="sCrit" type="number" value="${state.settings.defaultCriticalStock}" class="input" /></div>
            <div><label class="lbl">Personel Max İndirim (%)</label><input id="sDisc" type="number" value="${state.settings.maxStaffDiscount}" class="input" /></div>
          </div>
          <button onclick="saveSet()" class="btn btn-success btn-sm">Ayarları Kaydet</button>
        </div>

        <div class="card stack">
          <div class="row-between">
            <div class="title-md" style="margin:0;">Personel Hesapları</div>
            <button onclick="addStaff()" class="btn btn-primary btn-sm">+ Personel Ekle</button>
          </div>
          ${state.users.map(u => `
            <div class="list-item">
              <div><strong>${esc(u.name)}</strong> <span class="muted">(${u.role} • PIN: ${esc(u.pin)} • ${u.active?'Aktif':'Kapalı'})</span></div>
              ${u.role !== 'admin' ? `<button onclick="toggleStaff('${u.id}')" class="btn btn-secondary btn-sm">${u.active?'Kapat':'Aç'}</button>` : ''}
            </div>
          `).join('')}
        </div>

        <div class="card stack">
          <div class="title-md">Veri Yedekleme ve Sıfırlama</div>
          <div class="row-gap">
            <button onclick="exportJSON()" class="btn btn-primary btn-sm">Dışa Aktar (JSON)</button>
            <label class="btn btn-secondary btn-sm">İçe Aktar (JSON)<input type="file" accept=".json" onchange="importJSON(event)" class="hidden" /></label>
            <button onclick="resetAll()" class="btn btn-danger btn-sm">Tüm Verileri Sıfırla</button>
          </div>
        </div>
      `;
    }

    function saveSet() {
      const n = (document.getElementById('sName').value || 'DOĞU STORE').trim();
      const l = (document.getElementById('sLogo').value || 'DS').trim().toUpperCase();
      const pin = (document.getElementById('sPin').value || '').trim();
      if (!pin) return toast('PIN boş olamaz!', 'error');
      state.settings.storeName = n;
      state.settings.storeLogoText = l;
      state.settings.defaultCriticalStock = Math.max(0, parseInt(document.getElementById('sCrit').value || '5', 10));
      state.settings.maxStaffDiscount = Math.min(100, Math.max(0, Number(document.getElementById('sDisc').value ?? 20)));
      const adm = state.users.find(u => u.role === 'admin');
      if (adm) { adm.pin = pin; if (currentUser?.id === adm.id) currentUser.pin = pin; }
      logAction('Ayarlar Kaydedildi', n);
      saveState(); render(); toast('Ayarlar kaydedildi.', 'success');
    }

    function addStaff() {
      const name = (prompt('Personel adı:') || '').trim();
      const pin = (prompt('Personel PIN:') || '').trim();
      if (!name || !pin) return;
      if (state.users.some(u => u.pin === pin)) return toast('Bu PIN kullanımda!', 'error');
      state.users.push({ id: uid('usr'), name, role: 'staff', pin, active: true });
      logAction('Personel Eklendi', name);
      saveState(); render(); toast('Personel eklendi.', 'success');
    }

    function toggleStaff(id) {
      const u = state.users.find(x => x.id === id);
      if (!u || u.role === 'admin') return;
      u.active = !u.active;
      saveState(); render(); toast('Durum güncellendi.', 'success');
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dogu-store-${toLocalDateKey(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Yedek indirildi.', 'success');
    }

    function importJSON(ev) {
      const f = ev.target.files?.[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const p = JSON.parse(String(r.result || ''));
          state = { ...defaultState(), ...p };
          currentUser = state.users.find(u => u.id === currentUser?.id) || state.users[0];
          saveState(); render(); toast('Veriler içe aktarıldı.', 'success');
        } catch (e) { toast('Hatalı JSON dosyası!', 'error'); }
      };
      r.readAsText(f);
    }

    async function resetAll() {
      const ok = await requestPin('Tüm Verileri Sıfırla', 'Tüm veriler silinecek. Yönetici PIN girin.');
      if (!ok) return;
      const fresh = defaultState();
      fresh.settings.storeName = state.settings.storeName;
      fresh.settings.storeLogoText = state.settings.storeLogoText;
      state = fresh;
      currentUser = state.users[0];
      cart = [];
      saveState(); render(); toast('Temiz başlangıç yapıldı.', 'success');
    }

    render();
  </script>
</body>
</html>
